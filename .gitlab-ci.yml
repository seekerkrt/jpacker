workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $MIRROR_RELEASE_TAG && $MIRROR_RELEASE_ACTION =~ /^(sync|delete)$/'
    - when: never

stages:
  - release

mirror_github_release:
  stage: release
  image: alpine:3.22
  resource_group: github-release-$MIRROR_RELEASE_TAG
  before_script:
    - apk add --no-cache curl jq
  script:
    - sh .gitlab/mirror-github-release.sh
