# /etc/jpacker/jpacker.conf

# Editor command.
# Simple commands and simple options are supported, for example:
#   EDITOR=nano
#   EDITOR=vim
#   EDITOR=code --wait
# Complex shell syntax such as expansion, nested quoting, pipes, redirects,
# or command chains is intentionally unsupported for safety.
# EDITOR=vim

# Skip PKGBUILD review (default: false)
# NOEDIT=true

# Skip git diff check on update (default: false)
# NODIFF=true

# Log file
# LOGFILE=~/logs/jpacker.log
