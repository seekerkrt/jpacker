body:
  - type: markdown
    attributes:
      value: |
        You can post here even if you are not sure this is a Moguet bug, do not yet know the expected behavior, or have incomplete reproduction steps. Share only what you know.
        Moguetのbugか分からない、期待する挙動が不明、再現手順が不完全という段階でも投稿できます。分かる範囲だけ共有してください。

        Do not post security-sensitive details. Use [private vulnerability reporting](https://github.com/seekerkrt/moguet/security/advisories/new) instead.
        Security-sensitiveな内容は投稿せず、[Private vulnerability reporting](https://github.com/seekerkrt/moguet/security/advisories/new)から非公開で報告してください。
  - type: textarea
    id: details
    attributes:
      label: What happened or what would you like to confirm? / 何が起きたか、何を確認したいですか
      description: Describe the behavior or question with the information currently available. / 現在分かっている範囲で、挙動や確認したいことを記載してください。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Moguet version / Moguetのversion
      description: Include it if known. / 分かる場合だけ記載してください。
      placeholder: "Moguet vX.Y.Z"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment / 実行環境
      description: Include the OS or Arch Linux environment and architecture if known. / 分かる場合はOSまたはArch Linux環境とarchitectureを記載してください。
    validations:
      required: false
  - type: textarea
    id: command
    attributes:
      label: Command or reproduction commands / 実行したcommand・再現用command
      description: Share any commands you know, without secrets or credentials. / 分かるcommandがあれば、secretやcredentialを含めず記載してください。
      render: shell
    validations:
      required: false
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior / 期待した挙動・実際の挙動
      description: Share either or both if known. / 分かる場合だけ、いずれかまたは両方を記載してください。
    validations:
      required: false
  - type: textarea
    id: diagnostics_frequency
    attributes:
      label: Diagnostics and frequency / Log・diagnostic・再現頻度
      description: Add relevant logs, diagnostics, or frequency if available, after redacting sensitive data. / 利用可能なlog、diagnostic、再現頻度があれば、sensitive dataを除いて記載してください。
    validations:
      required: false
